[workspace]
members = [
    "crates/rust-dcp",
    "crates/rust-dcp-core",
    "crates/rust-dcp-membership-couchbase",
    "crates/rust-dcp-membership-kubernetes",
    "crates/rust-dcp-protocol",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/SisyphusSQ/rust-dcp"
authors = ["SisyphusSQ"]

[workspace.dependencies]
bytes = { version = "1.10", features = ["serde"] }
base64 = "0.22"
crc32fast = "1.5"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.4"
hmac = "0.12"
humantime-serde = "1.1"
k8s-openapi = "=0.26.0"
kube = { version = "=2.0.1", features = ["runtime"] }
pbkdf2 = "0.12"
rustls-native-certs = "0.8"
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
