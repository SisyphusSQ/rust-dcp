[workspace]
members = [
    "crates/rust-dcp",
    "crates/rust-dcp-core",
    "crates/rust-dcp-protocol",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/SisyphusSQ/rust-dcp"
authors = ["SisyphusSQ"]

[workspace.dependencies]
bytes = { version = "1.10", features = ["serde"] }
humantime-serde = "1.1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
